box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1e;--panel:#162329;--ink:#e8f2f5;--muted:#9bb2ba;--line:#294049;--pri:#17B7D1;--pri-d:#0e93aa;--pri-bg:#12303a;--red:#ff4b52;--red-d:#ff7a80;--red-bg:#3a1a1c;--good:#4fcf8a;--good-bg:#12311f;--warn:#f0b04a;--warn-bg:#352a12}}
:root[data-theme="dark"]{--bg:#0e1a1e;--panel:#162329;--ink:#e8f2f5;--muted:#9bb2ba;--line:#294049;--pri:#17B7D1;--pri-d:#0e93aa;--pri-bg:#12303a;--red:#ff4b52;--red-d:#ff7a80;--red-bg:#3a1a1c;--good:#4fcf8a;--good-bg:#12311f;--warn:#f0b04a;--warn-bg:#352a12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
header.top{background:var(--panel);border-bottom:3px solid var(--pri);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hin{max-width:1760px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{background:#fff;border-radius:8px;padding:2px 6px;display:flex}
.logo img{height:46px;display:block}
.ttl b{font-size:18px;display:block;line-height:1.2}.ttl span{color:var(--muted);font-size:12px}
nav{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
nav button{background:none;border:0;padding:9px 16px;border-radius:8px;font-weight:600;color:var(--muted)}
nav button.on{background:var(--pri);color:var(--on)}
.wrap{max-width:1760px;margin:0 auto;padding:16px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input[type=search],.bar select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:200px}
.sp{flex:1}
.btn{background:var(--pri);color:var(--on);border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn:hover{background:var(--pri-d)}
.btn.red{background:var(--red)}.btn.red:hover{background:var(--red-d)}
.btn.ghost{background:var(--panel);color:var(--pri-d);border:1px solid var(--pri)}
.btn.ghost:hover{background:var(--pri-bg)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.6;cursor:wait}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:8px;padding:12px 14px}
.kpi.r{border-left-color:var(--red)}.kpi.g{border-left-color:var(--good)}
.kpi span{color:var(--muted);font-size:12px;display:block}.kpi strong{font-size:20px}
.tw{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table.t{width:100%;border-collapse:collapse;min-width:820px}
.t th{background:var(--pri-bg);color:var(--pri-d);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;white-space:nowrap}
.t td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.t tr:hover td{background:var(--pri-bg)}
.t .num{text-align:right;white-space:nowrap}
.t small{color:var(--muted);display:block}
.t td>b{display:inline-block;min-width:150px}
.act{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.un{background:var(--red-bg);color:var(--red-d)}.tag.pa{background:var(--warn-bg);color:var(--warn)}.tag.ok{background:var(--good-bg);color:var(--good)}
.empty{padding:36px;text-align:center;color:var(--muted)}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px;min-width:90px}.prog i{display:block;height:100%;background:var(--good)}
.ov{position:fixed;inset:0;background:rgba(10,25,30,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 12px calc(20px + env(safe-area-inset-bottom,0px));z-index:20}
.ov.show{display:flex}
.modal{background:var(--panel);border-radius:12px;width:100%;max-width:1100px;border-top:4px solid var(--pri)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:17px}.x{background:none;border:0;font-size:24px;line-height:1;color:var(--muted)}
.mb{padding:16px 18px}.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.f.w{grid-column:1/-1}.ck{display:flex;gap:18px;padding:8px 0}.ck label{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:14px;font-weight:500;margin:0}
.ck input{width:auto}
.sec{font-weight:700;color:var(--pri-d);margin:16px 0 8px;font-size:13px;text-transform:uppercase}.sec:first-child{margin-top:0}
.pl{width:100%;border-collapse:collapse;margin:8px 0}.pl td{padding:6px 4px;border-bottom:1px solid var(--line)}.pl td:nth-child(2){text-align:right}
.sum{display:flex;gap:16px;flex-wrap:wrap;background:var(--pri-bg);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.vw{overflow-x:auto;background:#cfd8dc;padding:12px;border-radius:0 0 12px 12px}
#voucher{display:flex;flex-direction:column;width:794px;min-height:1123px;background:#fff;color:#1b2a30;padding:40px 48px;margin:0 auto;font-family:"Be Vietnam Pro",Arial,sans-serif;font-size:14px;line-height:1.5;position:relative}
#voucher .vh{display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid #00AAC9;padding-bottom:12px}
#voucher .vh img{height:64px}
#voucher .vh>div{text-align:right;font-size:12px;color:#5d727a}
#voucher h1{text-align:center;font-size:22px;color:#00AAC9;margin:22px 0 2px;letter-spacing:.02em}
#voucher .sub{text-align:center;color:#5d727a;font-size:12px;margin-bottom:16px}
#voucher .code{text-align:center;margin-bottom:18px}#voucher .code span{display:inline-block;border:2px solid #ED1C24;color:#A2161B;font-weight:700;font-size:18px;padding:4px 18px;border-radius:6px}
#voucher table{width:100%;border-collapse:collapse}
#voucher td{padding:8px 10px;border:1px solid #d8e4e8;vertical-align:top}
#voucher td:first-child{width:34%;background:#e8f7fb;font-weight:600;color:#0087a0}
#voucher .pol{margin-top:14px;border:1px solid #d8e4e8;border-left:4px solid #ED1C24;padding:10px 14px;white-space:pre-wrap}
#voucher .pol.note{border-left-color:#00AAC9}#voucher .pol.note b{color:#0087a0}#voucher .pol .nrt{color:#ED1C24;font-weight:700;text-transform:uppercase}#voucher .pol b{color:#A2161B;display:block;margin-bottom:2px}
#voucher .ft{margin-top:auto;border-top:3px solid #00AAC9;padding-top:10px;font-size:11px;color:#5d727a;text-align:center;line-height:1.6}#voucher .ft b{color:#1b2a30;font-size:12px}#voucher .nt{margin-top:18px;padding-bottom:18px;font-size:12px;color:#5d727a;text-align:center}
.lang{display:flex;border:1px solid var(--pri);border-radius:8px;overflow:hidden}.lang button{border:0;background:none;padding:6px 11px;font-weight:700;color:var(--pri-d)}.lang button.on{background:var(--pri);color:var(--on)}
body{min-height:100vh;display:flex;flex-direction:column}main.wrap{flex:1;width:100%}
footer.foot{background:var(--panel);border-top:3px solid var(--pri);margin-top:20px;color:var(--muted);font-size:13px}footer.foot .fi{max-width:1760px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;gap:4px 22px;align-items:center}footer.foot b{color:var(--ink)}
.hin{position:relative}
.hb{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600;position:relative}
.hb:hover{border-color:var(--pri)}
.badge{position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px;display:none}
.panel{display:none;position:absolute;right:16px;top:100%;width:390px;max-width:calc(100vw - 24px);max-height:75vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--pri);border-radius:0 0 10px 10px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px;z-index:10}.panel.show{display:block}
.ptl{font-weight:700;margin-bottom:8px}
.ni{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:8px;margin-bottom:8px;background:var(--bg)}
.ni.o{border-left-color:var(--red)}.ni.t{border-left-color:var(--warn)}.ni.s{border-left-color:var(--pri)}.ni.v{border-left-color:var(--good)}.ni .ic{font-size:20px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;text-transform:capitalize}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.dw{font-size:11px;color:var(--muted);font-weight:600;text-transform:capitalize}
.cd{background:none;border:1px solid transparent;border-radius:8px;padding:4px 0;min-height:42px;font-size:13px}.cd:hover{background:var(--pri-bg)}.cd.td{border-color:var(--pri);font-weight:700}.cd.sel{background:var(--pri);color:var(--on)}
.cd i{display:flex;justify-content:center;gap:2px;height:6px;margin-top:2px}
s.ci,s.co,s.due{display:inline-block;width:6px;height:6px;border-radius:50%;text-decoration:none}s.ci{background:var(--pri-d)}s.co{background:var(--good)}s.due{background:var(--red)}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0}.lg span{display:flex;align-items:center;gap:4px}
.evl{border-top:1px solid var(--line);padding-top:8px;font-size:13px}.evl div{display:flex;gap:6px;align-items:baseline;margin-top:4px}
#pov{z-index:30}
.rc{border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--bg)}.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:40;display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.back{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-weight:600;color:var(--pri-d);text-decoration:none;white-space:nowrap}
.back:hover{border-color:var(--pri);background:var(--pri-bg)}
.mode{display:inline-block;background:var(--red);color:#fff;border-radius:4px;padding:0 6px;font-size:11px;font-weight:700;letter-spacing:.06em;margin-left:6px;vertical-align:2px}
.st{display:flex;gap:6px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:14px;padding-bottom:8px}
.st button{background:none;border:1.5px solid transparent;border-radius:8px;padding:8px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.st button:hover{color:var(--ink);border-color:var(--line)}
.st button.on{color:#fff;background:var(--pri);border-color:var(--pri-d);box-shadow:0 1px 3px rgba(0,135,160,.35)}
.st button.on .cnt{background:#fff;color:var(--pri-d)}
.st .cnt{display:inline-block;margin-left:6px;background:var(--pri-bg);color:var(--pri-d);border-radius:99px;font-size:11px;padding:0 7px}
.th{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.th h1{margin:0;font-size:20px;line-height:1.25}.th .meta{color:var(--muted);font-size:13px}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:12px}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.pn h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--pri-d)}
.pn dl{margin:0;display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:6px 10px}
.pn dt{color:var(--muted);font-size:13px}.pn dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.wl{display:flex;flex-direction:column;gap:6px}
.wi{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 10px;border-radius:8px;background:var(--warn-bg);color:var(--ink);border-left:4px solid var(--warn)}
.wi.r{background:var(--red-bg);border-left-color:var(--red)}
.ok-line{color:var(--good);font-weight:600}
.tag.nu{background:var(--pri-bg);color:var(--pri-d)}.tag.gr{background:var(--line);color:var(--muted)}
.tag.dn{background:var(--good-bg);color:var(--good)}
.t td.act2{white-space:nowrap}
.t tr.dv td{background:var(--pri-bg)}
.hint{color:var(--muted);font-size:12px;margin:6px 0 10px}
.foot-t td{font-weight:700;background:var(--pri-bg)}
.inl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.res{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-variant-numeric:tabular-nums}
.res b{text-align:right}.res .sep{grid-column:1/-1;border-top:1px solid var(--line)}
.neg{color:var(--red-d)}.pos{color:var(--good)}
details.lg2{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px}
details.lg2 summary{cursor:pointer;font-weight:700;color:var(--pri-d)}
.f .hp{font-weight:400;color:var(--muted);font-size:11px;margin-top:2px}
.split{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}

 if(pax.length)P('w',pax.length+' dịch vụ tính theo Pax có số lượng khác tổng khách ('+g+'): '+pax.slice(0,3).map(l=>l.name).join(', ')+(pax.length>3?'…':'')+'.','est');
 if(t.guest.length){const c={ADL:0,CHD:0,INF:0};t.guest.forEach(x=>c[x.cat]=(c[x.cat]||0)+1);
  if(c.ADL!==num(t.adl)||c.CHD!==num(t.chd)||c.INF!==num(t.inf))P('w','Danh sách khách có '+c.ADL+' ADL, '+c.CHD+' CHD, '+c.INF+' INF; hồ sơ tour là '+t.adl+' / '+t.chd+' / '+t.inf+'.','hotel')}
 const hb={};t.hotel.forEach(h=>hb[h.name]=(hb[h.name]||0)+num(h.rooms)*num(h.per));
 Object.entries(hb).forEach(([n,cap])=>{if(cap<num(t.adl)+num(t.chd))P('w','Sức chứa phòng tại '+n+' ('+cap+' chỗ) thấp hơn số khách phải ở ('+(num(t.adl)+num(t.chd))+').','hotel')});
 t.hotel.forEach(h=>{if(t.start&&t.end&&(h.in<t.start||h.out>t.end))P('w','Ngày nhận/trả phòng tại '+h.name+' nằm ngoài thời gian tour.','hotel')});
 if(t.veh.length){const seats=t.veh.reduce((s,v)=>s+num(v.seats)*num(v.qty),0),need=seatsNeeded(t);if(seats<need)P('r','Tổng số chỗ xe ('+seats+') thấp hơn số chỗ cần ('+need+' gồm khách và nhân sự).','veh')}

 if(dd>=0&&dd<=3){const n=t.bk.filter(b=>b.st==='Yêu cầu báo giá').length;if(n)P('r','Tour khởi hành sau '+dd+' ngày nhưng còn '+n+' booking chưa xác nhận.','bk')}
 const a=t.pr.appr;if(a&&(num(a.adl)!==num(t.pr.sellAdl)||num(a.chd)!==num(t.pr.sellChd)||num(a.inf)!==num(t.pr.sellInf)))P('w','Giá bán đã thay đổi sau khi duyệt, cần duyệt lại.','pr');
 if((t.pr.revIncl&&t.pr.basis==='pre')||(!t.pr.revIncl&&t.pr.basis==='post'))P('w','Doanh thu và chi phí đang so sánh trên cơ sở VAT khác nhau.','pr');

 return w}

/* ---------- engine bảng ---------- */
function cellHtml(c,r,t){
 if(c.html)return c.html.pill?c.html(r[c.k]):c.html(r,t);
 let v=c.c?c.c(r,t):r[c.k];
 if(c.c)return esc(v);
 if(c.t==='m')return vnd(v);if(c.t==='p')return v===''||v==null?'':num(v)+'%';if(c.t==='d')return dmy(v);if(c.t==='dt')return fdt(v);if(c.t==='b')return v?'✓':'';
 return esc(v)}
function secView(key,t,opt){
 opt=opt||{};const S_=SEC[key],rows=S_.rows?S_.rows(t):t[S_.arr].map(r=>({...r})),cols=S_.cols.filter(c=>c.list);
 let h=`<div class="bar"><b>${opt.title||''}</b><span class="sp"></span>${opt.extra||''}<button class="btn" onclick="secOpen('${key}')">${S_.add}</button></div>`;
 if(S_.hint)h+=`<p class="hint">${S_.hint}</p>`;
 if(!rows.length)return h+`<div class="tw"><div class="empty">Chưa có dữ liệu. Bấm "${S_.add}" để thêm.</div></div>`;
 h+=`<div class="tw"><table class="t"><thead><tr>${cols.map(c=>`<th class="${c.num||['m','n'].includes(c.t)?'num':''}">${c.l}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${r._d?'dv':''}">${cols.map(c=>`<td class="${c.num||['m'].includes(c.t)?'num':''}">${cellHtml(c,r,t)}</td>`).join('')}<td class="act2">${r._d?`<small>Từ tab ${r._d}</small>`:`<div class="act">${S_.move?`<button class="btn sm ghost" aria-label="Lên" onclick="secMove('${key}','${r.id}',-1)">↑</button><button class="btn sm ghost" aria-label="Xuống" onclick="secMove('${key}','${r.id}',1)">↓</button>`:''}${S_.pdf?`<button class="btn sm" onclick="bkPdf('${r.id}')">Phiếu PDF</button>`:''}<button class="btn sm ghost" onclick="secOpen('${key}','${r.id}')">Sửa</button><button class="btn sm red" onclick="secDel('${key}','${r.id}')">Xóa</button></div>`}</td></tr>`).join('')}${S_.foot?S_.foot(t):''}</tbody></table></div>`;
 return h}
const xb=()=>'<button class="x" onclick="close_()" aria-label="Đóng">×</button>';
function open_(h){$('modal').innerHTML=h;$('ov').classList.add('show')}
function close_(){$('ov').classList.remove('show');$('modal').innerHTML=''}
const fld=(l,id,v,t='text',x='',help='')=>`<div class="f"><label for="${id}">${l}</label><input id="${id}" type="${t}" value="${esc(v)}" ${x}>${help?`<div class="hp">${help}</div>`:''}</div>`;
const selH=(l,id,opts,v,blank)=>`<div class="f"><label for="${id}">${l}</label><select id="${id}">${blank?'<option value=""></option>':''}${opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
function fieldHtml(c,v,t){
 const id='g_'+c.k;
 if(c.t==='s'){let o=c.o(t);if(v&&!o.includes(v))o=[...o,v];return selH(c.l,id,o,v,c.blank)}
 if(c.t==='a')return `<div class="f w"><label for="${id}">${c.l}</label><textarea id="${id}" rows="3">${esc(v)}</textarea></div>`;
 if(c.t==='b')return `<div class="f"><label>&nbsp;</label><div class="ck"><label><input type="checkbox" id="${id}" ${v?'checked':''}>${c.l}</label></div></div>`;
 const T_={t:'text',n:'number',m:'number',p:'number',d:'date',h:'time',dt:'datetime-local'}[c.t],x=['n','m','p'].includes(c.t)?'min="0" step="any"'+(c.t==='p'?' list="dl_vat"':''):'';
 return fld(c.l,id,v,T_,(c.ph?`placeholder="${esc(c.ph)}" `:'')+x,c.help||'')}
let ed={sec:null,id:null};
const err=m=>{$('err').textContent=m;return false};
function secOpen(key,id){
 const S_=SEC[key],t=tour();let r;
 if(id){r=t[S_.arr].find(x=>x.id===id);if(!r)return}else r=Object.assign({},S_.def?S_.def(t):{});
 ed={sec:key,id};
 open_(`<div class="mh"><h2>${id?'Sửa':'Thêm'} ${S_.one}</h2>${xb()}</div><div class="mb"><div class="g2">${S_.cols.filter(c=>c.t).map(c=>fieldHtml(c,r[c.k]!==undefined?r[c.k]:'',t)).join('')}</div><datalist id="dl_vat"><option value="0"><option value="5"><option value="8"><option value="10"></datalist><p id="err" role="alert" style="color:var(--red-d);margin:8px 0 0"></p></div><div class="mf"><button class="btn ghost" onclick="close_()">Hủy</button><button class="btn" onclick="secSave()">Lưu</button></div>`)}
function secSave(){
 const S_=SEC[ed.sec],t=tour(),r={};
 for(const c of S_.cols.filter(c=>c.t)){const el=$('g_'+c.k);let v;
  if(c.t==='b')v=el.checked;else{v=el.value.trim();if(['n','m','p'].includes(c.t))v=v===''?'':Number(v)}
  if(c.req&&(v===''||v==null))return err(c.l+' là trường bắt buộc.');
  if(typeof v==='number'&&v<0)return err(c.l+' không được âm.');
  r[c.k]=v}
 const e=S_.val&&S_.val(r,t);if(e)return err(e);
 const A=t[S_.arr];
 if(ed.id){const i=A.findIndex(x=>x.id===ed.id);A[i]=Object.assign({},A[i],r)}else{r.id=uid();if(S_.mk)S_.mk(r,t);A.push(r)}
 save();close_();render();toast('Đã lưu')}
function secDel(key,id){const S_=SEC[key];open_(`<div class="mh"><h2>Xóa ${S_.one}</h2>${xb()}</div><div class="mb">Xóa dòng này? Thao tác này không thể hoàn tác.</div><div class="mf"><button class="btn ghost" onclick="close_()">Giữ lại</button><button class="btn red" onclick="secDo('${key}','${id}')">Xóa</button></div>`)}
function secDo(key,id){const t=tour();t[SEC[key].arr]=t[SEC[key].arr].filter(x=>x.id!==id);save();close_();render()}
function secMove(key,id,d){const A=tour()[SEC[key].arr],i=A.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=A.length)return;[A[i],A[j]]=[A[j],A[i]];save();render()}
function itinSort(){const t=tour();t.itin.sort((a,b)=>(a.date+(a.from||'')).localeCompare(b.date+(b.from||'')));save();render();toast('Đã sắp xếp theo ngày và giờ')}
function guestBulk(){open_(`<div class="mh"><h2>Thêm nhiều khách</h2>${xb()}</div><div class="mb"><div class="f"><label for="gb">Mỗi dòng một khách. Có thể thêm loại khách sau dấu chấm phẩy, ví dụ: Nguyễn Văn An; CHD</label><textarea id="gb" rows="8"></textarea></div></div><div class="mf"><button class="btn ghost" onclick="close_()">Hủy</button><button class="btn" onclick="guestBulkDo()">Thêm</button></div>`)}
function guestBulkDo(){const t=tour();let n=0;$('gb').value.split('\n').forEach(l=>{const [name,cat]=l.split(';').map(x=>x.trim());if(!name)return;t.guest.push({id:uid(),code:nid(t,'g','K-',3),name,cat:GCAT.includes((cat||'').toUpperCase())?cat.toUpperCase():'ADL',dob:'',room:'',rtype:'',mate:'',req:'',note:''});n++});save();close_();render();toast('Đã thêm '+n+' khách')}

function tourOpen(id){
 const t=id?T.find(x=>x.id===id):{code:'',name:'',type:'Khách đoàn',market:'Nội địa',depart:'TP. Hồ Chí Minh',route:'',start:'',end:'',night:false,trans:'Xe giường nằm',std:'4 sao',vat:true,status:'Báo giá',note:'',adl:0,chd:0,inf:0,special:0,veg:0,assist:0,inv:0,rep:'',repTel:'',email:'',sales:'',ops:'',designer:''};

 open_(`<div class="mh"><h2>${id?'Sửa hồ sơ tour':'Tạo tour'}</h2>${xb()}</div><div class="mb" oninput="tourAuto()" onchange="tourAuto()">
 <div class="sec">Thông tin tổng quan</div><div class="g2">
 ${fld('Mã tour / Mã đoàn *','t_code',t.code,'text',id?'readonly':'',id?'Mã đoàn không thay đổi sau khi tạo':'Duy nhất, ví dụ K76.A14')}${fld('Tên tour *','t_name',t.name)}
 ${selH('Loại tour *','t_type',TYPES,t.type)}${selH('Thị trường khách *','t_market',MARKETS,t.market)}${fld('Điểm khởi hành *','t_depart',t.depart)}${fld('Tuyến tour *','t_route',t.route,'text','','Ví dụ: HCM – Phú Yên – Quy Nhơn – HCM')}
 ${fld('Ngày khởi hành *','t_start',t.start,'date')}${fld('Ngày kết thúc *','t_end',t.end,'date')}
 <div class="f w"><div class="ck"><label><input type="checkbox" id="t_night" ${t.night?'checked':''}>Khởi hành ban đêm (đêm đầu trên xe, ngày đầu không tính thành một ngày riêng)</label></div><div class="hp" id="t_auto"></div></div>
 ${selH('Hình thức di chuyển *','t_trans',TRANS,t.trans)}${selH('Tiêu chuẩn lưu trú *','t_std',STARS,t.std)}${selH('Yêu cầu hóa đơn *','t_vat',['Có VAT','Không VAT'],t.vat?'Có VAT':'Không VAT')}${selH('Trạng thái tour *','t_status',TST,t.status)}

 ${fld('Số khách người lớn (ADL)','t_adl',t.adl,'number','min="0"')}${fld('Số trẻ em có tính phí (CHD)','t_chd',t.chd,'number','min="0"')}${fld('Số em bé (INF)','t_inf',t.inf,'number','min="0"')}
 ${fld('Số khách có yêu cầu đặc biệt','t_special',t.special,'number','min="0"')}${fld('Số khách ăn chay','t_veg',t.veg,'number','min="0"')}${fld('Số khách cần hỗ trợ di chuyển','t_assist',t.assist,'number','min="0"')}${fld('Số khách cần xuất hóa đơn riêng','t_inv',t.inv,'number','min="0"')}
 ${fld('Người đại diện đoàn','t_rep',t.rep)}${fld('Số điện thoại trưởng đoàn','t_repTel',t.repTel,'tel')}${fld('Email liên hệ','t_email',t.email,'email')}</div>
 <div class="sec">Phụ trách</div><div class="g2">${fld('Nhân viên Sales phụ trách','t_sales',t.sales)}${fld('Nhân viên điều hành','t_ops',t.ops)}${fld('Người thiết kế tour','t_designer',t.designer)}</div>
 ${id?`<div class="sec">Lịch sử thay đổi</div><div class="g2">${fld('Người cập nhật','t_by',by,'text','','Bắt buộc khi đổi trạng thái, ngày, số khách, tuyến hoặc phụ trách')}${fld('Lý do thay đổi','t_why','')}</div>`:''}

function tourAuto(){const e=$('t_auto');if(!e)return;const t={start:$('t_start').value,end:$('t_end').value,night:$('t_night').checked};const dn=dayNight(t),g=num($('t_adl').value)+num($('t_chd').value)+num($('t_inf').value);
 e.textContent=(t.start&&t.end&&t.end>t.start?'Tự tính: '+dn.d+' ngày '+dn.n+' đêm · ':'Chọn ngày đi và ngày về · ')+'Tổng số khách: '+g}
function tourSave(id){
 const v=k=>$('t_'+k).value.trim();
 const n={code:v('code'),name:v('name'),type:v('type'),market:v('market'),depart:v('depart'),route:v('route'),start:v('start'),end:v('end'),night:$('t_night').checked,trans:v('trans'),std:v('std'),vat:v('vat')==='Có VAT',status:v('status'),note:v('note'),adl:num(v('adl')),chd:num(v('chd')),inf:num(v('inf')),special:num(v('special')),veg:num(v('veg')),assist:num(v('assist')),inv:num(v('inv')),rep:v('rep'),repTel:v('repTel'),email:v('email'),sales:v('sales'),ops:v('ops'),designer:v('designer')};
 if(!n.code||!n.name||!n.depart||!n.route||!n.start||!n.end)return err('Vui lòng nhập đủ các trường có dấu *.');
 if(n.end<=n.start)return err('Ngày kết thúc phải sau ngày khởi hành.');
 if(n.adl+n.chd+n.inf<1)return err('Tổng số khách phải từ 1 trở lên.');
 if(!n.sales&&!n.ops)return err('Cần nhập ít nhất một người phụ trách (Sales hoặc điều hành).');
 if(n.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(n.email))return err('Email liên hệ chưa đúng định dạng.');
 if([n.adl,n.chd,n.inf,n.special,n.veg,n.assist,n.inv].some(x=>x<0))return err('Số lượng khách không được âm.');
 if(id){
  const t=T.find(x=>x.id===id),ch=WATCH.filter(([k])=>t[k]!==n[k]);
  const by=v('by');
  if(ch.length&&!by)return err('Nhập người cập nhật để lưu lịch sử thay đổi.');
  if(by){try{localStorage.setItem(UKEY,by)}catch(e){}}
  ch.forEach(([k,l])=>t.log.push({at:new Date().toISOString(),by,f:l,from:String(t[k]),to:String(n[k]),why:v('why')}));
  delete n.code;Object.assign(t,n);
 }else{
  if(T.some(x=>x.code.toLowerCase()===n.code.toLowerCase()))return err('Mã đoàn đã tồn tại.');
  const t=norm(Object.assign({id:uid(),staff:[],itin:[],est:[],bk:[],hotel:[],guest:[],veh:[],ext:[],log:[]},n));T.unshift(t);id=t.id;
 }
 save();close_();toast('Đã lưu hồ sơ tour');if(!cur||cur!==id)openTour(id);else render()}

  const parts=[],cen=[];let off=0;

  files.forEach(([name,data])=>{
   const nb=enc.encode(name),c=crc(data),h=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0)]);

   off+=h.length+nb.length+data.length});

function estModel(t){
 const m=money(t),pr=t.pr,dn=dayNight(t);
 const gi=g=>{const i=GROUPS.indexOf(g);return i<0?99:i};
 const lines=allLines(t).map((l,i)=>{const r=num(l.vat),add=!l.vi&&r>0,fac=(l.factor===''||l.factor==null)?1:num(l.factor),price=num(l.price)*(add?1+r/100:1);
  return{i,group:l.group,name:l.name+(l._d&&l.note?' ('+l.note+')':''),date:l.date||'',qty:num(l.qty),unit:l.unit||'',price,pf:add?{p:num(l.price),r}:null,fac,amt:num(l.qty)*price*fac,vat:r>0?'VAT':'KHÔNG VAT',tax:lineTax(l).tax}});
 const dayOf=d=>d&&t.start?'Ngày '+(diff(t.start,d)+1):'';
 const byDate=(a,b)=>(a.date||'~').localeCompare(b.date||'~')||a.i-b.i;
 const secs=[
  {t:'NHÀ HÀNG',items:lines.filter(l=>l.group==='Nhà hàng').sort(byDate),day:1},
  {t:'PHÒNG KHÁCH SẠN',items:lines.filter(l=>l.group==='Phòng khách sạn')},
  {t:'DỊCH VỤ KHÁC',items:lines.filter(l=>l.group!=='Nhà hàng'&&l.group!=='Phòng khách sạn').sort((a,b)=>gi(a.group)-gi(b.group)||a.i-b.i)}].filter(s=>s.items.length);
 secs.forEach(s=>s.items.forEach(l=>l.day=s.day?dayOf(l.date):''));
 const sumLines=lines.reduce((a,l)=>a+l.amt,0),tax=lines.reduce((a,l)=>a+l.tax,0);
 const st=t.staff,cnt=r=>st.filter(s=>s.role===r).length;
 const staff={mgmt:cnt('Quản lý')+cnt('Media / Photographer'),guide:cnt('Trưởng đoàn / TL')+cnt('Hướng dẫn viên'),driver:cnt('Tài xế')};
 const foc=num(pr.focN)*num(pr.sellAdl),gross=num(t.adl)*num(pr.sellAdl)+num(t.chd)*num(pr.sellChd)+num(t.inf)*num(pr.sellInf);
 const sub=gross+num(pr.surBeer)+num(pr.surSoft)+num(pr.sur);
 return{t,m,pr,dn,secs,lines,sumLines,tax,deduct:pr.basis==='pre'?tax:0,staff,foc,gross,sub,
  title:'BẢNG DỰ TOÁN '+t.code+' – '+t.name+' – '+guests(t)+' KHÁCH',
  sub1:(t.vat?'LẤY HÓA ĐƠN VAT':'KHÔNG LẤY HÓA ĐƠN VAT')+(t.sales||t.ops||t.designer?' · SALES: '+(t.sales||'–')+' · ĐIỀU HÀNH: '+(t.ops||'–')+' · THIẾT KẾ: '+(t.designer||'–'):''),
  dep:(t.night?'ĐÊM ':'')+(t.start?dmy(t.start):'–'),
  fname:'Dự toán - '+clean(t.code)+' - '+clean(t.name)}}

const nrm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]+/g,' ').trim();
const RM_H={code:['ma khach','ma','code','customer code'],name:['ho ten','ho va ten','ten khach','ten','name','full name'],cat:['loai khach','loai','cat','type','doi tuong'],dob:['ngay sinh','dob','birthday','date of birth'],room:['ma phong','phong','room','so phong'],rtype:['loai phong','room type','hang phong'],mate:['nguoi o cung','o cung','roommate'],req:['yeu cau dac biet','yeu cau','special request','request'],note:['ghi chu','note','notes']};
function rmISO(v){
 if(v===''||v==null)return'';
 let y,m,d;
 if(typeof v==='number'){if(v<1||v>80000)return null;const x=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);y=x.getUTCFullYear();m=x.getUTCMonth()+1;d=x.getUTCDate()}
 else{const s=String(v).trim();let a;
  if(a=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(s)){y=+a[1];m=+a[2];d=+a[3]}
  else if(a=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/.exec(s)){d=+a[1];m=+a[2];y=+a[3]}
  else return null}
 const x=new Date(Date.UTC(y,m-1,d));if(x.getUTCFullYear()!==y||x.getUTCMonth()!==m-1||x.getUTCDate()!==d||y<1900||y>new Date().getFullYear()+1)return null;
 return y+'-'+pad(m)+'-'+pad(d)}
function parseCsv(txt){const rows=[];let r=[],c='',q=false;txt=txt.replace(/^﻿/,'');const sep=(txt.split('\n')[0].match(/;/g)||[]).length>(txt.split('\n')[0].match(/,/g)||[]).length?';':',';
 for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='"'){if(txt[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===sep){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}
 if(c!==''||r.length){r.push(c);rows.push(r)}return rows}
/* chuyển bảng thô thành danh sách khách + báo cáo kiểm tra */
function rmParse(t,rows,mode){
 const rep={ok:[],err:[],warn:[],dup:0,ex:0,total:0};
 let hi=-1,map={};
 for(let i=0;i<Math.min(rows.length,15);i++){const mm={};(rows[i]||[]).forEach((h,j)=>{const k=nrm(h);if(!k)return;for(const f in RM_H)if(mm[f]==null&&RM_H[f].includes(k))mm[f]=j});if(mm.name!=null){hi=i;map=mm;break}}
 if(hi<0){rep.fatal='Không tìm thấy cột "Họ tên" ở 15 dòng đầu. Hãy dùng file mẫu và giữ nguyên dòng tiêu đề.';return rep}
 const get=(r,f)=>map[f]==null?'':String(r[map[f]]??'').trim();
 const exist=mode==='replace'?[]:t.guest,seen=new Set(exist.filter(g=>g.dob).map(g=>nrm(g.name)+'|'+g.dob)),names=new Set(exist.map(g=>nrm(g.name)));
 const usedCodes=new Set(exist.map(g=>g.code));
 const catMap={adl:'ADL',nl:'ADL','nguoi lon':'ADL',adult:'ADL',chd:'CHD',te:'CHD','tre em':'CHD',child:'CHD',inf:'INF',eb:'INF','em be':'INF',infant:'INF'};
 const rtMap={twin:'Twin',tw:'Twin',double:'Double',dbl:'Double',dbl2:'Double',triple:'Triple',trp:'Triple',single:'Single',sgl:'Single'};
 for(let i=hi+1;i<rows.length;i++){
  const r=rows[i]||[];if(!r.some(x=>String(x??'').trim()!==''))continue;
  const ln=i+1,name=get(r,'name');rep.total++;
  if(rep.total>2000){rep.err.push({ln,m:'Vượt quá 2.000 khách, các dòng sau bị bỏ qua.'});break}
  if(!name){rep.err.push({ln,m:'Thiếu họ tên.'});continue}
  if(/\(\s*vi\s*du\s*\)/.test(name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d'))){rep.ex++;continue}
  const errs=[];
  const dobRaw=map.dob==null?'':r[map.dob],dob=rmISO(dobRaw);if(dob===null)errs.push('Ngày sinh "'+dobRaw+'" không hợp lệ (dùng dd/mm/yyyy).');
  let cat='',cr=get(r,'cat');
  if(cr){cat=catMap[nrm(cr)];if(!cat)errs.push('Loại khách "'+cr+'" không hợp lệ (ADL / CHD / INF).')}
  else if(dob&&t.start){const a=(Date.parse(t.start)-Date.parse(dob))/31557600000;cat=a<5?'INF':a<12?'CHD':'ADL'}else cat='ADL';
  let rt='',rr=get(r,'rtype');if(rr){rt=rtMap[nrm(rr)];if(!rt)errs.push('Loại phòng "'+rr+'" không hợp lệ (Twin / Double / Triple / Single).')}
  if(errs.length){rep.err.push({ln,m:name+': '+errs.join(' ')});continue}
  if(dob&&t.start&&cr){const a=(Date.parse(t.start)-Date.parse(dob))/31557600000,exp=a<5?'INF':a<12?'CHD':'ADL';if(exp!==cat)rep.warn.push({ln,m:name+': loại khách '+cat+' nhưng theo ngày sinh khi khởi hành là '+exp+'.'})}
  const key=nrm(name)+'|'+dob;
  if(dob&&seen.has(key)){rep.dup++;rep.warn.push({ln,m:name+': trùng họ tên và ngày sinh, đã bỏ qua.'});continue}
  if(!dob&&names.has(nrm(name)))rep.warn.push({ln,m:name+': trùng họ tên với khách khác (không có ngày sinh để phân biệt), vẫn được thêm.'});
  if(dob)seen.add(key);names.add(nrm(name));
  let code=get(r,'code');if(code&&usedCodes.has(code)){rep.warn.push({ln,m:name+': mã khách '+code+' đã tồn tại, hệ thống sẽ tự sinh mã mới.'});code=''}
  if(code)usedCodes.add(code);
  rep.ok.push({id:uid(),code,name,cat,dob:dob||'',room:get(r,'room'),rtype:rt,mate:get(r,'mate'),req:get(r,'req'),note:get(r,'note')})}
 /* kiểm tra phòng */
 const rooms={};rep.ok.concat(mode==='replace'?[]:exist).forEach(g=>{if(g.room)(rooms[g.room]=rooms[g.room]||[]).push(g)});
 Object.entries(rooms).forEach(([k,a])=>{const ts=[...new Set(a.map(g=>g.rtype).filter(Boolean))];
  if(ts.length>1)rep.warn.push({ln:'',m:'Phòng '+k+': các khách khai báo loại phòng khác nhau ('+ts.join(', ')+').'});
  const cap=Math.min(...ts.map(x=>ROOM_CAP[x]).filter(Boolean),99);if(cap<99&&a.length>cap)rep.warn.push({ln:'',m:'Phòng '+k+' có '+a.length+' khách, vượt sức chứa '+ts[0]+' ('+cap+').'})});
 return rep}

let RM_RAW=null;
async function rmPick(again){

 if(!again){RM_RAW=null;RM=null;go.disabled=true;pv.innerHTML=''}
 if(!again&&!f)return;

/* --- đọc --- */
function anyISO(v){
 if(v===''||v==null)return'';let y,m,d,a;
 if(typeof v==='number'){if(v<1||v>80000)return null;const x=new Date(Date.UTC(1899,11,30)+Math.floor(v)*864e5);y=x.getUTCFullYear();m=x.getUTCMonth()+1;d=x.getUTCDate()}
 else{const s=String(v).trim();
  if(a=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(s)){y=+a[1];m=+a[2];d=+a[3]}
  else if(a=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/.exec(s)){d=+a[1];m=+a[2];y=+a[3]}else return null}
 const x=new Date(Date.UTC(y,m-1,d));if(x.getUTCFullYear()!==y||x.getUTCMonth()!==m-1||x.getUTCDate()!==d||y<1990||y>2100)return null;
 return y+'-'+pad(m)+'-'+pad(d)}
function anyTime(v){
 if(v===''||v==null)return'';
 if(typeof v==='number'){if(v<0||v>=2)return null;const mi=Math.round((v%1)*1440);return pad(Math.floor(mi/60)%24)+':'+pad(mi%60)}
 const a=/^(\d{1,2})[:h](\d{2})/.exec(String(v).trim());if(!a||+a[1]>23||+a[2]>59)return null;return pad(+a[1])+':'+pad(+a[2])}
function anyDT(v){
 if(v===''||v==null)return'';
 if(typeof v==='number'){const d=anyISO(v),tm=anyTime(v%1);return d&&tm!==null?d+'T'+tm:null}
 const s=String(v).trim(),a=/^(.*?)[ T]+(\d{1,2}[:h]\d{2}.*)$/.exec(s);
 if(!a){const d=anyISO(s);return d?d+'T00:00':null}
 const d=anyISO(a[1]),tm=anyTime(a[2]);return d&&tm!==null?d+'T'+tm:null}
function anyNum(v){
 if(typeof v==='number')return v;
 let s=String(v).trim().replace(/\s|₫|vnđ|vnd|đ/gi,'');if(s==='')return'';
 if(/^-?\d{1,3}([.,]\d{3})+$/.test(s))s=s.replace(/[.,]/g,'');else s=s.replace(',','.');
 const n=Number(s);return Number.isFinite(n)?n:NaN}
function typed(c,v,opts){
 if(v===''||v==null||(typeof v==='string'&&v.trim()===''))return{v:''};
 switch(c.t){
  case 'd':{const x=anyISO(v);return x===null?{e:'"'+v+'" không phải ngày hợp lệ (dd/mm/yyyy)'}:{v:x}}
  case 'h':{const x=anyTime(v);return x===null?{e:'"'+v+'" không phải giờ hợp lệ (HH:MM)'}:{v:x}}
  case 'dt':{const x=anyDT(v);return x===null?{e:'"'+v+'" không phải ngày giờ hợp lệ (dd/mm/yyyy HH:MM)'}:{v:x}}
  case 'n':case 'm':case 'p':{const x=anyNum(v);return Number.isNaN(x)?{e:'"'+v+'" không phải số'}:{v:x}}
  case 'b':{if(typeof v==='boolean')return{v};const s=nrm(v);if(['co','x','1','yes','true','y','v'].includes(s)||String(v)==='✓')return{v:true};if(['khong','0','no','false','n'].includes(s))return{v:false};return{e:'"'+v+'" không phải Có/Không'}}
  case 's':{const s=String(v).trim();const f=opts&&opts.find(o=>nrm(o)===nrm(s));return{v:f||s,off:opts&&!f}}
  default:{let s=String(v).trim();if(typeof v==='number'&&/tel/i.test(c.k)&&/^\d{9}$/.test(s))s='0'+s;return{v:s}}}}
function findHdr(rows,labels){

function wrap(f,text,sz,mw){

  let cur='';
  par.split(' ').forEach(w=>{
   const t=cur?cur+' '+w:w;
   if(tw(f,t,sz)<=mw){cur=t;return}

   if(tw(f,w,sz)<=mw){cur=w;return}
   for(const ch of w){if(tw(f,cur+ch,sz)<=mw)cur+=ch;else{L.push(cur);cur=ch}}
  });
  L.push(cur)});

  const sz=10,lh=13.5,pad=9,mw=CW-pad*2-6,lines=wrap(f,text||'–',sz,mw);let first=true;

   const hdr=first?lh+3:0;
   let avail=Math.floor((BOT-y-pad*2-hdr)/lh);
   if(avail<1||(first&&lines.length>1&&avail<2)){newPage();continue}
   const seg=lines.splice(0,avail),h=hdr+seg.length*lh+pad*2-2;
   box('#d8e4e8',M,y,CW,h);fill(bar,M,y,3,h);
   let ty=y+pad-1;
   if(first){txt(FB,title,sz,tc,M+pad+3,ty);ty+=hdr}
   seg.forEach((s,i)=>txt(f,s,sz,c,M+pad+3,ty+i*lh));
   y+=h+(lines.length?0:10);first=false}};
 (sp.blocks||[]).forEach(b=>block(b[0],b[1],FR,'#1b2a30','#00AAC9','#0087a0'));
 y+=6;
 wrap(FR,sp.note||'',8.5,CW).forEach(s=>{if(y+12>BOT)newPage();ctr(FR,s,8.5,'#5d727a',y);y+=12});
 fill('#00AAC9',M,H-86,CW,2.5);
 ctr(FB,CO.name,9.5,'#1b2a30',H-76);
 ctr(FR,'Địa chỉ: '+CO.addr,8.5,'#5d727a',H-62);
 ctr(FR,'Điện thoại: '+CO.tel+' · Fax: '+CO.fax,8.5,'#5d727a',H-49);
 
// ---- assemble PDF objects
 const objs=[null,null,null],enc=new TextEncoder();
 const add=(d,s)=>{objs.push({d,s});return objs.length-1};
 const fontObj=(F,name)=>{
  const ff=add(`<< /Length1 ${F.len} /Filter /FlateDecode >>`,b64u(F.ttf));
  const pairs=[],seen=new Set();F.cps.forEach((c,i)=>{if(!seen.has(F.gids[i])){seen.add(F.gids[i]);pairs.push([F.gids[i],c,F.adv[i]])}});
  pairs.sort((a,c)=>a[0]-c[0]);
  let cm='/CIDInit /ProcSet findresource begin 12 dict begin begincmap /CIDSystemInfo << /Registry (Adobe) /Ordering (UCS) /Supplement 0 >> def /CMapName /Adobe-Identity-UCS def /CMapType 2 def 1 begincodespacerange <0000> <FFFF> endcodespacerange\n';
  for(let i=0;i<pairs.length;i+=100){const ch=pairs.slice(i,i+100);cm+=ch.length+' beginbfchar\n'+ch.map(p=>`<${p[0].toString(16).padStart(4,'0')}> <${p[1].toString(16).padStart(4,'0')}>`).join('\n')+'\nendbfchar\n'}
  cm+='endcmap CMapName currentdict /CMap defineresource pop end end';
  const tu=add('<< >>',enc.encode(cm));
  const fd=add(`<< /Type /FontDescriptor /FontName /${name} /Flags 32 /FontBBox [${F.bb.join(' ')}] /ItalicAngle 0 /Ascent ${F.asc} /Descent ${F.desc} /CapHeight ${F.cap} /StemV 80 /FontFile2 ${ff} 0 R >>`);
  const cid=add(`<< /Type /Font /Subtype /CIDFontType2 /BaseFont /${name} /CIDSystemInfo << /Registry (Adobe) /Ordering (Identity) /Supplement 0 >> /FontDescriptor ${fd} 0 R /CIDToGIDMap /Identity /DW 1000 /W [${pairs.map(p=>p[0]+' ['+p[2]+']').join(' ')}] >>`);
  return add(`<< /Type /Font /Subtype /Type0 /BaseFont /${name} /Encoding /Identity-H /DescendantFonts [${cid} 0 R] /ToUnicode ${tu} 0 R >>`)};
 const f1=fontObj(PA.reg,'LiberationSans'),f2=fontObj(PA.bold,'LiberationSans-Bold');
 const L=PA.logo,sm=add(`<< /Type /XObject /Subtype /Image /Width ${L.w} /Height ${L.h} /ColorSpace /DeviceGray /BitsPerComponent 8 /Filter /FlateDecode >>`,b64u(L.alpha));
 const im=add(`<< /Type /XObject /Subtype /Image /Width ${L.w} /Height ${L.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /FlateDecode /SMask ${sm} 0 R >>`,b64u(L.rgb));
 const kids=pages.map(p=>{const c=add('<< >>',enc.encode(p.join('\n')));
  return add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >> /XObject << /Im1 ${im} 0 R >> >> /Contents ${c} 0 R >>`)});
 const u16=s=>'FEFF'+[...s].map(ch=>ch.codePointAt(0).toString(16).padStart(4,'0')).join('');
 const info=add(`<< /Title <${u16(sp.title)}> /Producer (KHANHTRAVEL GIT Operation) >>`);
 objs[1]={d:'<< /Type /Catalog /Pages 2 0 R >>'};
 objs[2]={d:`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`};
 const parts=[],offs=[];let len=0;
 const push=x=>{if(typeof x==='string')x=enc.encode(x);parts.push(x);len+=x.length};
 push(new Uint8Array([0x25,0x50,0x44,0x46,0x2d,0x31,0x2e,0x37,0x0a,0x25,0xe2,0xe3,0xcf,0xd3,0x0a]));
 for(let i=1;i<objs.length;i++){const o=objs[i];offs[i]=len;
  push(`${i} 0 obj\n`+(o.s?o.d.replace(/>>$/,`/Length ${o.s.length} >>`):o.d));
  if(o.s){push('\nstream\n');push(o.s);push('\nendstream')}
  push('\nendobj\n')}
 const xr=len;
 push(`xref\n0 ${objs.length}\n0000000000 65535 f \n`+offs.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length} /Root 1 0 R /Info ${info} 0 R >>\nstartxref\n${xr}\n%%EOF`);
 const out=new Uint8Array(len);let p=0;parts.forEach(x=>{out.set(x,p);p+=x.length});return out}
